name: Build Pyrogram Docs as JSON

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-json-docs:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. DEBUG: Print Makefile + compiler structure ──────────────────────
      #    This tells us EXACTLY what the secret bash script does.
      #    Check the Actions log after first run to understand the build.
      - name: Debug - Print Makefile
        run: |
          echo "====== Makefile ======"
          cat Makefile || echo "No Makefile found"

      - name: Debug - List compiler/ directory
        run: |
          echo "====== compiler/ structure ======"
          find compiler/ -type f | sort || echo "No compiler/ dir"
          echo ""
          echo "====== compiler scripts content ======"
          find compiler/ -name "*.py" | xargs head -50 2>/dev/null || true

      - name: Debug - List docs/source/ to see what RST files already exist
        run: |
          echo "====== docs/source/ structure ======"
          find docs/source -type f | sort
          echo ""
          echo "====== api/methods exists? ======"
          ls docs/source/api/methods/ 2>/dev/null | head -20 || echo "MISSING - needs compiler"

      # ── 3. Python + deps ───────────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package + Sphinx
        run: |
          pip install --upgrade pip
          pip install -e . --quiet
          pip install sphinx furo sphinx-copybutton --quiet

      # ── 4. Run compiler scripts ────────────────────────────────────────────
      #    Replicates what their secret TG_KAPG_DOCS_PBURL bash script does
      - name: Run compiler - generate API RST files
        run: |
          echo "=== Trying compiler scripts ==="
          python compiler/api/compiler.py    2>&1 || true
          python compiler/errors/compiler.py 2>&1 || true
          python -m compiler.api             2>&1 || true
          python -m compiler.errors          2>&1 || true

          echo "=== After compiler ==="
          echo "api/methods/ files: $(find docs/source/api/methods/ -name '*.rst' 2>/dev/null | wc -l)"
          echo "api/types/ files:   $(find docs/source/api/types/   -name '*.rst' 2>/dev/null | wc -l)"
          echo "telegram/ files:    $(find docs/source/telegram/     -name '*.rst' 2>/dev/null | wc -l)"

      - name: Try make (generates RST; ignore failures from missing secret deps)
        run: make 2>&1 || true

      # ── 5. Build JSON ──────────────────────────────────────────────────────
      - name: Build Sphinx JSON docs
        run: |
          sphinx-build \
            -b json \
            docs/source \
            docs/_build/json \
            -E \
            -D html_theme=furo
          echo "Total .fjson: $(find docs/_build/json -name '*.fjson' | wc -l)"
          find docs/_build/json -name "*.fjson" | head -30

      # ── 6. Size report ────────────────────────────────────────────────────
      - name: Size report
        run: |
          du -sh docs/_build/json/
          find docs/_build/json -name "*.fjson" -exec du -sh {} + | sort -rh | head -10

      # ── 7. Package + Upload ───────────────────────────────────────────────
      - name: Package
        run: |
          cd docs/_build
          tar -czf pyrogram-docs-json.tar.gz json/
          echo "Archive: $(du -sh pyrogram-docs-json.tar.gz)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyrogram-docs-json
          path: docs/_build/pyrogram-docs-json.tar.gz
          retention-days: 90

      # ── 8. Publish to docs-json branch ───────────────────────────────────
      #    Files accessible at:
      #    https://dishapatel010.github.io/pyrogram/api/methods/send_message.fjson
      - name: Publish to docs-json branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: docs-json
          publish_dir: docs/_build/json
          force_orphan: true
          commit_message: "docs: update JSON build [skip ci]"
